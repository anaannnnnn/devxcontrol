<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <title>Jarvis</title>
  <link rel="manifest" href="/jarvis/manifest.webmanifest?v=3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307060e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c23bff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff5db1'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/jarvis/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/jarvis/jarvis.css?v=3">
</head>
<body data-state="idle">
  <div class="ambient"></div>
  <div class="bloom"></div>

  <!-- LOGIN (voice-first): who are you -> password -> glow -> voice mode -->
  <section id="login" class="screen">
    <div class="top"><span></span><span class="pill"><span class="dot"></span>Jarvis</span><span style="width:40px"></span></div>
    <div class="stage">
      <div class="orb-wrap"><canvas id="orb-lg" width="300" height="300"></canvas></div>
      <div class="greet">
        <h1 id="lg-title">Good evening.</h1>
        <p id="lg-sub">Tap to speak — who am I talking to?</p>
      </div>
      <form id="lg-name-form" class="lg-field">
        <input id="lg-name" placeholder="your name" autocomplete="username" autocapitalize="off" spellcheck="false">
        <button class="lg-go" type="submit" aria-label="Next">→</button>
      </form>
      <form id="lg-pass-form" class="lg-field" style="display:none">
        <input id="lg-pass" type="password" placeholder="password" autocomplete="current-password">
        <button class="lg-go" type="submit" aria-label="Enter">→</button>
      </form>
      <div id="lg-code-wrap" class="lg-field" style="display:none">
        <input id="lg-code" placeholder="2FA code" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <div class="lg-err" id="lg-err" aria-live="polite"></div>
      <div class="lg-hint"><button id="lg-mic" type="button">🎙 say your name</button></div>
    </div>
  </section>

  <!-- APP (voice mode) -->
  <main id="app" class="screen" style="display:none">
    <div class="top">
      <button class="icon-btn" id="btn-menu" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <span class="pill"><span class="dot"></span><span id="assistant">Jarvis</span><span class="beta">LIVE</span></span>
      <div class="top-right">
        <button class="icon-btn" id="btn-chat" aria-label="Transcript">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </div>
    <div class="stage">
      <div class="ghost" id="ghost"></div>
      <div class="orb-wrap"><canvas id="orb" width="330" height="330"></canvas></div>
      <div class="caption" id="caption">Tap the orb and speak.</div>
      <div class="listening"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>Listening…</div>
    </div>
    <div class="dock">
      <button class="side" id="btn-kill" aria-label="Kill switch" title="Kill switch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/></svg>
      </button>
      <button class="mic" id="btn-talk" aria-label="Talk">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15z"/><path d="M5 11.5a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18.5V22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="side" id="btn-type" aria-label="Type">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      </button>
    </div>
  </main>

  <!-- confirmation cards -->
  <div class="cards" id="cards"></div>

  <!-- transcript sheet -->
  <div class="sheet" id="sheet"><div class="grab"></div><div class="msgs" id="msgs"></div></div>

  <!-- typed input (hidden until chosen) -->
  <form id="textform" class="cards" style="display:none;bottom:calc(var(--dock) + 20px)">
    <div class="card" style="display:flex;gap:8px;padding:10px">
      <input id="textin" placeholder="Type to Jarvis…" autocomplete="off" style="flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)">
      <button class="btn ok" style="flex:0 0 auto" type="submit">Send</button>
    </div>
  </form>

  <script type="module" src="/jarvis/jarvis.js?v=3"></script>
</body>
</html>
