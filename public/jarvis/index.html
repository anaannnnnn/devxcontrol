<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060d">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307060d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b48cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b48cff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/jarvis/jarvis.css">
</head>
<body>
  <!-- Login gate (shown only if the session is not authenticated) -->
  <form id="login" class="login" hidden autocomplete="on">
    <div class="orb-mini"></div>
    <h1>Jarvis</h1>
    <p class="muted">Sign in to continue.</p>
    <input id="lg-user" name="username" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="lg-pass" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <input id="lg-code" name="code" placeholder="2FA code (if enabled)" inputmode="numeric" autocomplete="one-time-code">
    <button id="lg-go" type="submit">Enter</button>
    <div id="lg-err" class="err" aria-live="polite"></div>
  </form>

  <!-- Main experience -->
  <main id="app" hidden>
    <header class="top">
      <span id="assistant" class="brand">Jarvis</span>
      <div class="controls">
        <button id="readonly" class="pill" title="Read-only mode" aria-pressed="false">read-only</button>
        <button id="kill" class="pill danger" title="Kill switch — disables all actions" aria-pressed="false">kill</button>
      </div>
    </header>

    <section class="stage">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div id="status" class="status">Tap to talk</div>
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>

    <div id="caption" class="caption" aria-live="polite"></div>

    <footer class="dock">
      <button id="talk" class="talk" aria-label="Hold or tap to talk">
        <span class="talk-ring"></span>
        <span class="talk-dot"></span>
      </button>
      <form id="textform" class="textform" hidden>
        <input id="textin" placeholder="Type to Jarvis…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
      <button id="toggletext" class="link" type="button">type instead</button>
    </footer>
  </main>

  <script type="module" src="/jarvis/jarvis.js"></script>
</body>
</html>
