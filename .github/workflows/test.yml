name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test
      - name: Demo boots and answers
        shell: bash
        run: |
          node scripts/demo.mjs & pid=$!
          for i in $(seq 1 15); do curl -fs http://localhost:3000/healthz && ok=1 && break; sleep 1; done
          kill $pid || true
          [ "${ok:-0}" = 1 ]
